/* =========================================================
   MOBILE / SMALL-SCREEN PASSPORT LAYOUT
   Responsive refinements: phones, narrow phones, touch controls
   ========================================================= */

/* Prevent accidental page-wide horizontal scrolling */
html {
  width: 100%;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}
body {
  width: 100%;
  min-width: 0;
  overflow-x: hidden;
}
.page,
.passport,
.section,
.section-body,
.summary,
.hero {
  min-width: 0;
  max-width: 100%;
}

/* Tablet and phone */
@media (max-width: 760px) {
  .page {
    width: 100%;
    margin: 8px auto;
    padding: 0 8px 18px;
  }

  .toolbar {
    width: 100%;
    gap: 8px;
    margin-bottom: 10px;
  }

  .toolbar a,
  .toolbar button {
    min-height: 42px;
    padding: 9px 12px;
    font-size: 14px;
  }

  .passport {
    border-radius: 12px;
  }

  .hero {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 14px;
    padding: 16px 14px;
  }

  .brand {
    align-items: flex-start;
    gap: 9px;
  }

  .brand-icon {
    font-size: 26px;
    line-height: 1.2;
    flex: 0 0 auto;
  }

  .hero h1 {
    font-size: clamp(19px, 5.4vw, 25px);
    line-height: 1.25;
    overflow-wrap: anywhere;
  }

  .hero p {
    font-size: 13px;
    line-height: 1.45;
  }

  .idbox {
    min-width: 0;
    width: 100%;
    text-align: left;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    justify-items: start;
    gap: 4px;
  }

  .idbox .badge {
    max-width: 100%;
    white-space: normal;
    line-height: 1.4;
  }

  .idbox code {
    display: block;
    width: 100%;
    font-size: 11px;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .summary {
    grid-template-columns: minmax(0, 1fr);
    gap: 14px;
    padding: 14px;
  }

  .photo {
    display: block;
    width: 100%;
    height: auto;
    max-height: 300px;
    min-height: 150px;
    object-fit: cover;
    object-position: center;
  }

  .healthbox {
    margin-top: 10px;
    padding: 12px;
  }

  .healthbox .score {
    font-size: 30px;
  }

  /* Compact tree fact rows into label/value blocks on phone */
  .facts,
  .facts tbody,
  .facts tr,
  .facts th,
  .facts td {
    display: block;
    width: 100%;
  }

  .facts {
    border-collapse: separate;
    border-spacing: 0;
  }

  .facts tr {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 2px;
    padding: 9px 0;
    border-bottom: 1px solid #e8efeb;
  }

  .facts th,
  .facts td {
    border: 0;
    padding: 0;
    text-align: left;
  }

  .facts th {
    font-size: 11px;
    line-height: 1.35;
    text-transform: uppercase;
    letter-spacing: .035em;
  }

  .facts td {
    font-size: 14px;
    line-height: 1.45;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .section {
    margin: 0 8px 12px;
    border-radius: 10px;
  }

  .section-head {
    padding: 12px 13px;
    font-size: 15px;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }

  .section-body {
    padding: 12px;
  }

  .grid {
    grid-template-columns: minmax(0, 1fr);
    gap: 9px;
  }

  .metric {
    padding: 11px;
  }

  .metric .value {
    font-size: 18px;
    line-height: 1.35;
  }

  /* Keep wide data tables contained and scrollable, not clipped */
  .table-wrap {
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 7px;
  }

  .data-table {
    min-width: 560px;
    font-size: 12px;
  }

  .data-table th,
  .data-table td {
    padding: 8px 7px;
  }

  .list {
    padding-left: 19px;
  }

  .notice,
  .empty {
    font-size: 12px;
    line-height: 1.5;
    overflow-wrap: anywhere;
  }

  .qr-section {
    margin: 0 8px 14px;
    padding: 13px 10px;
  }

  .qr-section h2,
  .qr-section h3 {
    font-size: 16px;
    line-height: 1.35;
  }

  .qr-url {
    width: 100%;
    font-size: 10px;
    line-height: 1.45;
    word-break: break-all;
  }

  .qr-canvas-wrap {
    width: min(100%, 240px);
    min-width: 0;
    min-height: 0;
    padding: 8px;
    margin: 10px auto;
  }

  .qr-canvas-wrap canvas,
  .qr-canvas-wrap img {
    max-width: 100%;
    height: auto;
  }

  .qr-actions {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin: 10px 0;
  }

  .qr-actions button,
  .qr-actions a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    width: 100%;
    padding: 9px 8px;
    font-size: 12px;
    line-height: 1.3;
    text-align: center;
    overflow-wrap: anywhere;
  }

  .host-config {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    justify-items: stretch;
    gap: 8px;
    text-align: left;
    font-size: 12px;
  }

  .host-config input {
    width: 100%;
    min-width: 0;
    min-height: 42px;
    font-size: 14px;
  }

  .host-config button,
  .host-config .action {
    min-height: 42px;
  }

  .footer {
    padding: 0 10px 14px;
    font-size: 11px;
    line-height: 1.5;
  }
}

/* Narrow phones (e.g. 320–390px wide) */
@media (max-width: 420px) {
  .page {
    padding-left: 5px;
    padding-right: 5px;
  }

  .toolbar {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  }

  .toolbar a,
  .toolbar button {
    width: 100%;
    text-align: center;
    padding: 8px 6px;
    font-size: 12px;
  }

  .hero {
    padding: 13px 10px;
  }

  .summary {
    padding: 10px;
  }

  .section,
  .qr-section {
    margin-left: 5px;
    margin-right: 5px;
  }

  .section-body {
    padding: 10px;
  }

  .facts td {
    font-size: 13px;
  }

  .qr-actions {
    grid-template-columns: minmax(0, 1fr);
  }

  .qr-actions button,
  .qr-actions a {
    min-height: 42px;
    font-size: 13px;
  }
}

/* Respect users who prefer reduced animation */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

</style>

    <script>

            for (var i = 0; i < maxEc; i++) {
                for (var r = 0; r < rs.length; r++) {
                    if (i < ecData[r].length) finalData.push(ecData[r][i]);
                }
            }

            // Matrix construction
            var size = ver * 4 + 17;
            var matrix = new Array(size);
            for (var i = 0; i < size; i++) matrix[i] = new Array(size).fill(null);

            function setFinder(r, c) {
                for (var dr = -1; dr <= 7; dr++) {
                    if (r + dr < 0 || r + dr >= size) continue;
                    for (var dc = -1; dc <= 7; dc++) {
                        if (c + dc < 0 || c + dc >= size) continue;
                        if ((0 <= dr && dr <= 6 && (dc === 0 || dc === 6)) ||
                            (0 <= dc && dc <= 6 && (dr === 0 || dr === 6)) ||
                            (2 <= dr && dr <= 4 && 2 <= dc && dc <= 4)) {
                            matrix[r + dr][c + dc] = true;
                        } else {
                            matrix[r + dr][c + dc] = false;
                        }
                    }
                }
            }
            setFinder(0, 0); setFinder(size - 7, 0); setFinder(0, size - 7);

            // Alignment
            var pos = PATTERNS[ver - 1] || [];
            for (var i = 0; i < pos.length; i++) {
                for (var j = 0; j < pos.length; j++) {
                    var ar = pos[i], ac = pos[j];
                    if (matrix[ar][ac] !== null) continue;
                    for (var dr = -2; dr <= 2; dr++) {
                        for (var dc = -2; dc <= 2; dc++) {
                            matrix[ar + dr][ac + dc] = (dr === -2 || dr === 2 || dc === -2 || dc === 2 || (dr === 0 && dc === 0));
                        }
                    }
                }
            }

            // Timing
            for (var r = 8; r < size - 8; r++) if (matrix[r][6] === null) matrix[r][6] = (r % 2 === 0);
            for (var c = 8; c < size - 8; c++) if (matrix[6][c] === null) matrix[6][c] = (c % 2 === 0);

            // Type Info (Mask 0)
            // FIX: RS_BLOCK_TABLE groups are ordered L,M,Q,H (index 0,1,2,3), but the
            // ISO/IEC 18004 format-info field does NOT use that same numbering -
            // it requires L=01, M=00, Q=11, H=10. Writing the raw table index (0)
            // straight into the format bits told every real scanner "this is level M"
            // while the data was actually built with level L's block sizes, so the
            // codeword layout scanners computed from the (wrong) format info never
            // matched the actual data -> unreadable QR that still looked fine visually.
            var G15 = 1335, G15_MASK = 21522;
            var ecLevelBits = [1, 0, 3, 2]; // table-index -> ISO format-info code
            var tData = (ecLevelBits[ec] << 3) | 0;
            var d = tData << 10;
            while (d >= G15) {
                var shift = Math.floor(Math.log2(d)) - Math.floor(Math.log2(G15));
                if (shift < 0) break;
                d ^= (G15 << shift);
            }
            var tBits = ((tData << 10) | d) ^ G15_MASK;
            for (var i = 0; i < 15; i++) {
                var bit = ((tBits >> i) & 1) === 1;
                if (i < 6) matrix[i][8] = bit;
                else if (i < 8) matrix[i + 1][8] = bit;
                else matrix[size - 15 + i][8] = bit;

                if (i < 8) matrix[8][size - i - 1] = bit;
                else if (i < 9) matrix[8][15 - i] = bit;
                else matrix[8][15 - i - 1] = bit;
            }
            matrix[size - 8][8] = true;

            // Map data
            var inc = -1, row = size - 1, bitIdx = 7, byteIdx = 0;
            for (var col = size - 1; col > 0; col -= 2) {
                if (col === 6) col--;
                while (true) {
                    for (var c = 0; c < 2; c++) {
                        if (matrix[row][col - c] === null) {
                            var dark = false;
                            if (byteIdx < finalData.length) {
                                dark = (((finalData[byteIdx] >>> bitIdx) & 1) === 1);
                            }
                            var mask = (row + (col - c)) % 2 === 0;
                            if (mask) dark = !dark;
                            matrix[row][col - c] = dark;
                            bitIdx--;
                            if (bitIdx === -1) { byteIdx++; bitIdx = 7; }
                        }
                    }
                    row += inc;
                    if (row < 0 || row >= size) { row -= inc; inc = -inc; break; }
                }
            }

            return { matrix: matrix, size: size };
        }

        window.renderDirectQR = function (text, containerId, canvasId, options) {
            options = options || {};
            var darkColor = options.colorDark || '#1b4332';
            var lightColor = options.colorLight || '#ffffff';
            var displaySize = options.width || 180;
            var margin = 2;

            try {
                var qr = makeQR(text);
                var count = qr.size;
                var fullCount = count + margin * 2;

                // 1. Render Vector SVG
                var paths = [];
                for (var r = 0; r < count; r++) {
                    for (var c = 0; c < count; c++) {
                        if (qr.matrix[r][c]) {
                            paths.push('M' + (c + margin) + ',' + (r + margin) + 'h1v1h-1z');
                        }
                    }
                }
                var svgHtml = '<svg id="qr-svg-graphic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + fullCount + ' ' + fullCount + '" width="' + displaySize + '" height="' + displaySize + '" shape-rendering="crispEdges" style="display:block;margin:0 auto;border-radius:4px;">' +
                    '<rect width="100%" height="100%" fill="' + lightColor + '"/>' +
                    '<path d="' + paths.join(' ') + '" fill="' + darkColor + '"/>' +
                    '</svg>';

                var container = document.getElementById(containerId);
                if (container) {
                    container.innerHTML = svgHtml;
                }

                // 2. Render to Canvas for download
                var canvas = document.getElementById(canvasId);
                if (canvas) {
                    canvas.width = displaySize;
                    canvas.height = displaySize;
                    var ctx = canvas.getContext('2d');
                    if (ctx) {
                        ctx.fillStyle = lightColor;
                        ctx.fillRect(0, 0, displaySize, displaySize);
                        var tileW = displaySize / fullCount;
                        var tileH = displaySize / fullCount;
                        ctx.fillStyle = darkColor;
                        for (var r = 0; r < count; r++) {
                            for (var c = 0; c < count; c++) {
                                if (qr.matrix[r][c]) {
                                    var x = Math.round((c + margin) * tileW);
                                    var y = Math.round((r + margin) * tileH);
                                    var w = Math.ceil((c + margin + 1) * tileW) - x;
                                    var h = Math.ceil((r + margin + 1) * tileH) - y;
                                    ctx.fillRect(x, y, w, h);
                                }
                            }
                        }
                    }
                }
                return true;
            } catch (e) {
                console.error("Direct QR render failed:", e);
                return false;
            }
        };
    })();

<script>
'use strict';
let passportData=null;
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const has=value=>value!==null&&value!==undefined&&value!=='';
const val=(value,unit='')=>has(value)?`${esc(value)}${unit}`:'<span class="missing">Not available</span>';
const dateVal=value=>{if(!has(value))return 'Not available';const d=new Date(value);return isNaN(d)?esc(value):esc(d.toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric'}));};
const num=(value,d=2)=>has(value)&&Number.isFinite(Number(value))?Number(value).toFixed(d):'Not available';
function section(title,body){return `<section class="section"><div class="section-head">${title}</div><div class="section-body">${body||'<div class="empty">No data is available for this section.</div>'}</div></section>`;}
function metric(label,value,sub=''){return `<div class="metric"><div class="label">${label}</div><div class="value">${value}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;}
function table(headers,rows){if(!rows||!rows.length)return '<div class="empty">No records available for this tree.</div>';return `<div class="table-wrap"><table class="data-table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c??'<span class="missing">Not available</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function jsonList(items){if(!Array.isArray(items)||!items.length)return '<div class="empty">No records available.</div>';return `<ul class="list">${items.map(x=>`<li>${esc(typeof x==='string'?x:JSON.stringify(x))}</li>`).join('')}</ul>`;}
async function fetchOptional(url){try{const r=await fetch(url);if(!r.ok)throw new Error(`HTTP ${r.status}`);return await r.json();}catch(e){console.info('Optional passport source unavailable:',url,e.message);return null;}}
function getBaseUrl(){const saved=localStorage.getItem('tea_custom_qr_host');return saved&&saved.trim()?saved.trim().replace(/\/$/,''):window.location.origin;}
function makeQR(){if(!passportData)return;const url=`${getBaseUrl()}/tree_passport.html?id=${encodeURIComponent(passportData.tree.tree_id)}`;$('qr-url-text').textContent=url;const canvas=$('qr-canvas');const svg=$('qr-svg-container');svg.innerHTML='';canvas.style.display='none';if(typeof window.renderDirectQR==='function'){window.renderDirectQR(url,'qr-svg-container','qr-canvas',{width:190,colorDark:'#1b4332',colorLight:'#ffffff'});}else{$('qr-message').textContent='QR renderer could not initialize. Copy the link below.';}}
function applyHost(){const host=$('host-override-input').value.trim();if(host&&!/^https?:\/\//i.test(host)){alert('Enter a complete URL beginning with http:// or https://');return;}if(host)localStorage.setItem('tea_custom_qr_host',host.replace(/\/$/,''));else localStorage.removeItem('tea_custom_qr_host');makeQR();}
function copyLink(){const url=$('qr-url-text').textContent;navigator.clipboard?.writeText(url).then(()=>alert('Passport link copied.')).catch(()=>prompt('Copy passport link:',url));}
function downloadQR(){const canvas=$('qr-canvas');if(canvas&&canvas.toDataURL){const a=document.createElement('a');a.download=`tree-${passportData.tree.tree_id.slice(0,8)}-passport-qr.png`;a.href=canvas.toDataURL('image/png');a.click();return;}const svg=$('qr-svg-graphic');if(svg){const blob=new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`tree-${passportData.tree.tree_id.slice(0,8)}-passport-qr.svg`;a.click();}}
function mapLink(t){if(!has(t.latitude)||!has(t.longitude))return '<span class="missing">Coordinates not available</span>';const url=`https://www.google.com/maps?q=${encodeURIComponent(`${t.latitude},${t.longitude}`)}`;return `<a href="${url}" target="_blank" rel="noopener">Open location in map ↗</a>`;}
function renderPassport(d,extra){const t=d.tree||{},h=d.health||{},e=d.environment||{},eco=d.ecosystem||{},soil=extra.soil,climate=extra.climate,satellite=extra.satellite,mort=d.mortality||{},med=extra.medicinal?.profile||extra.medicinal||{},post=extra.postdeath?.profile||extra.postdeath||{};const healthScore=h.current_score;const healthStatus=h.current_status|| (has(healthScore)?(healthScore>=80?'Healthy':healthScore>=60?'Moderate':healthScore>=40?'At Risk':'Unhealthy'):'Not assessed');const img=(t.images||[]).find(Boolean);const status=d.death_record?'Recorded as dead':(t.life_status||'Active / status not recorded');
const facts=[['Scientific name','Camellia sinensis'],['Location',t.location_name],['Country',t.country],['Latitude',has(t.latitude)?num(t.latitude,6):null],['Longitude',has(t.longitude)?num(t.longitude,6):null],['Elevation',has(t.elevation)?`${num(t.elevation,1)} m`:null],['Height',has(t.height)?`${num(t.height,2)} m`:null],['Trunk diameter',has(t.diameter)?`${num(t.diameter,2)} cm`:null],['Estimated ring count / age',has(t.ring_count)?`${esc(t.ring_count)} rings (age estimate)`:null],['Tree life status',status],['Registered',dateVal(t.created_at)],['Last updated',dateVal(t.updated_at)]];
const healthRows=(h.records||[]).map(x=>[dateVal(x.analyzed_at||x.created_at),val(x.health_score??x.score),val(x.health_status??x.status),val(x.image_path),val((x.issues||[]).map(i=>i.type||i).join(', '))]);
const envRows=(e.records||[]).map(x=>[dateVal(x.timestamp),val(x.temperature,' °C'),val(x.humidity,' %'),val(x.rainfall??x.precipitation,' mm'),val(x.wind_speed,' m/s'),val(x.soil_moisture)]);
const soilProps=soil?.soil_parameters||soil?.parameters||soil?.properties||[];
const soilRows=Array.isArray(soilProps)?soilProps.map(x=>[val(x.name),val(x.value),val(x.unit),val(x.rating),val(x.optimal)]):Object.entries(soilProps).map(([k,v])=>[esc(k),val(typeof v==='object'?v.value:v),val(typeof v==='object'?v.unit:''),val(typeof v==='object'?v.rating:''),val(typeof v==='object'?v.optimal:'')]);
const climateCurrent=climate?.current||{};const forecast=climate?.forecast_7day||climate?.forecast||[];const satRecords=satellite?.daily||satellite?.records||satellite?.data||[];
const ehi=eco.latest?.ecosystem_health_index??eco.latest?.ehi??eco.calculated?.ecosystem_health_index;
const death=d.death_record;
$('passport-content').innerHTML=`<div class="hero"><div class="brand"><span class="brand-icon">🌿</span><div><h1>Wild Tea Tree Digital Passport</h1><p>Public botanical profile and tree-linked research record</p></div></div><div class="idbox"><span class="badge">${esc(status)}</span><small>Passport ID</small><code>${esc(t.tree_id)}</code></div></div>
<div class="summary"><div><img class="photo" src="${esc(img||'')}" alt="Tree specimen photo" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="empty" style="display:none">No tree photograph is registered.</div><div class="healthbox"><div style="font-size:12px;font-weight:800;text-transform:uppercase">Health score</div><div class="score">${has(healthScore)?`${num(healthScore,1)} / 100`:'N/A'}</div><div class="state">${esc(healthStatus)}</div></div></div><div><table class="facts"><tbody>${facts.map(([k,v])=>`<tr><th>${esc(k)}</th><td>${has(v)?v:'<span class="missing">Not available</span>'}</td></tr>`).join('')}<tr><th>Map</th><td>${mapLink(t)}</td></tr></tbody></table></div></div>
${section('📏 Tree identity and measurements',`<div class="grid">${metric('Tree ID',esc(t.tree_id||'Not available'))}${metric('Location',esc(t.location_name||'Not available'))}${metric('Height',val(t.height,' m'))}${metric('Diameter',val(t.diameter,' cm'))}${metric('Elevation',val(t.elevation,' m'))}${metric('Ring count',val(t.ring_count))}</div>`)}
${section('❤️ Health status and health history',`<div class="grid">${metric('Current score',has(healthScore)?`${num(healthScore,1)} / 100`:'Not assessed',esc(healthStatus))}${metric('Assessments',String((h.records||[]).length))}</div><h4>Recorded assessments</h4>${table(['Date','Score','Status','Image','Issues'],healthRows)}<h4>Other health check records</h4>${table(['Date','Score','Status','Details'],(h.checks||[]).map(x=>[dateVal(x.created_at||x.timestamp),val(x.health_score??x.score),val(x.health_status??x.status),val(x.description??x.notes)]))}`)}
${section('🌦️ Environmental observations',`<div class="grid">${metric('Latest temperature',val(e.latest?.temperature,' °C'))}${metric('Latest humidity',val(e.latest?.humidity,' %'))}${metric('Latest rainfall',val(e.latest?.rainfall??e.latest?.precipitation,' mm'))}${metric('Environmental records',String((e.records||[]).length))}</div><h4>Observation history</h4>${table(['Date','Temperature','Humidity','Rainfall','Wind','Soil moisture'],envRows)}`)}
${section('🌱 Soil health and tea suitability',soil?`<div class="grid">${metric('Suitability score',val(soil.suitability?.score??soil.score,' / 100'))}${metric('Suitability class',esc(soil.prediction?.class??soil.prediction?.label??'Not available'))}</div><h4>Soil parameters</h4>${table(['Parameter','Value','Unit','Rating','Optimal'],soilRows)}<h4>Limiting factors</h4>${jsonList(soil.prediction?.restricting_factors||soil.restricting_factors)}<h4>Recommendations</h4>${jsonList(soil.prediction?.fertilizer_recommendations||soil.fertilizer_recommendations)}<p class="notice">Soil properties may be external SoilGrids estimates or project fallback values. Refer to the Soil Portal for the source and limitations.</p>`:'<div class="empty">Soil data is currently unavailable. See the Soil Portal or retry later.</div>')}
${section('🌍 Ecosystem Health Index',`<div class="grid">${metric('EHI',has(ehi)?`${num(ehi,1)} / 100`:'Not available',esc(eco.latest?.status||eco.calculated?.status||'Status unavailable'))}${metric('Saved EHI records',String((eco.records||[]).length))}</div>${table(['Date','EHI','Status','Region'],(eco.records||[]).map(x=>[dateVal(x.created_at||x.timestamp),val(x.ecosystem_health_index??x.ehi),val(x.status),val(x.region)]))}<p class="notice">The project stores EHI only if an EHI record was saved. A missing score is not replaced with a fabricated value.</p>`)}
${section('🌡️ Climate information',climate?`<div class="grid">${metric('Current temperature',val(climateCurrent.temperature,' °C'))}${metric('Humidity',val(climateCurrent.humidity,' %'))}${metric('Wind',val(climateCurrent.wind_speed,' km/h'))}${metric('Precipitation',val(climateCurrent.precipitation,' mm'))}</div><h4>7-day forecast</h4>${table(['Date','Min temp','Max temp','Rainfall','Conditions'],forecast.map(x=>[dateVal(x.date),val(x.temp_min,' °C'),val(x.temp_max,' °C'),val(x.precipitation,' mm'),val(x.weather_description)]))}`:'<div class="empty">Live climate data could not be loaded. The Climate Simulator may contain additional tools.</div>')}
${section('🛰️ Satellite / vegetation observations',satellite?`<div class="grid">${metric('Vegetation index',val(satellite.summary?.vegetation_health_index))}${metric('Period',val(satellite.period?.days,' days'))}${metric('Mean temperature',val(satellite.summary?.avg_temperature,' °C'))}${metric('Total precipitation',val(satellite.summary?.total_precipitation_mm,' mm'))}</div>${table(['Date','Index','Temperature','Rainfall','Solar radiation'],satRecords.map(x=>[dateVal(x.date),val(x.vegetation_index??x.vhi),val(x.temperature??x.temp,' °C'),val(x.precipitation,' mm'),val(x.solar_radiation)]))}<p class="notice">Satellite module values are vegetation/environment proxies provided by the existing platform; they are not necessarily direct satellite imagery or a laboratory diagnosis.</p>`:'<div class="empty">Satellite/vegetation data is unavailable right now.</div>')}
${section('⚠️ Mortality risk assessment',mort&&has(mort.mortality_risk_score)?`<div class="grid">${metric('Risk score',`${num(mort.mortality_risk_score,1)} / 100`)}${metric('Risk level',esc(mort.risk_level||'Not available'))}</div><p>${esc(mort.disclaimer||'Rule-based prototype assessment')}</p><h4>Risk factors</h4>${jsonList(mort.factors)}<h4>Recommendations</h4>${jsonList(mort.recommendations)}<p class="notice">This is an experimental rule-based project model, not a validated biological prediction of tree death. It must not be used as a substitute for expert field assessment.</p>`:'<div class="empty">Mortality risk has not been calculated or is unavailable.</div>')}
${section('🍃 Medicinal / bioactive research profile',med&&Object.keys(med).length?`<p>${esc(med.description||med.title||'Species-level research information for Camellia sinensis.')}</p><h4>Plant parts</h4>${table(['Part','Importance','Compounds','Research areas'],(med.plant_parts||[]).map(x=>[val(x.part),val(x.importance),val((x.compounds||[]).join(', ')),val((x.research_areas||[]).join(', '))]))}<h4>Major compounds</h4>${table(['Compound','Full name','Category','Research interest'],(med.major_compounds||[]).map(x=>[val(x.name),val(x.full_name),val(x.category),val(x.research_interest)]))}<p class="notice">Species-level research information, not a tree-specific chemical test, medical advice, treatment, or dosage recommendation.</p>`:'<div class="empty">Medicinal profile unavailable.</div>')}
${section('♻️ Potential post-death utilization',post&&Object.keys(post).length?`<p>${esc(post.description||'Potential utilization options for suitable tree biomass.')}</p>${table(['Use','Potential','Material','Notes'],(post.uses||[]).map(x=>[val(x.name??x.use),val(x.potential??x.importance),val(x.material??x.parts),val(x.description??x.notes)]))}<p class="notice">Diseased or contaminated biomass should not automatically be composted or reused. Disposal and utilization require appropriate expert assessment.</p>`:'<div class="empty">Post-death utilization profile unavailable.</div>')}
${section('🧾 Conservation anomalies and death record',`<h4>Recorded death event</h4>${death?table(['Recorded at','Reason','Notes','Status'],[[dateVal(death.recorded_at||death.created_at),val(death.reason),val(death.notes),val(death.life_status)] ]):'<div class="empty">No death event is recorded for this tree.</div>'}<h4>Conservation / anomaly records</h4>${table(['Date','Type','Severity','Status','Description'],(d.conservation_anomalies||[]).map(x=>[dateVal(x.created_at),val(x.type??x.anomaly_type),val(x.severity),val(x.status),val(x.description)]))}`)}
${section('📚 Data provenance and availability',`<p>Passport data is retrieved for this tree ID from the TeaTree backend at the time this page is opened.</p><div class="grid">${metric('Environment records',String((e.records||[]).length))}${metric('Health assessments',String((h.records||[]).length))}${metric('Ecosystem records',String((eco.records||[]).length))}${metric('Generated',dateVal(d.metadata?.generated_at))}</div><p class="notice">Not every module stores data per individual tree. When the platform has no tree-linked record, this passport indicates that the data is unavailable. Regional dashboards, general reports, and unlinked citizen sightings are not attributed to this tree.</p>`)}
<section class="qr-section print-hide"><h2 style="margin:0;color:var(--green)">📱 Dynamic QR code</h2><p>Scan or open this link to view the latest public passport for this tree.</p><div class="qr-url" id="qr-url-text"></div><div class="qr-canvas-wrap"><div id="qr-svg-container"></div><canvas id="qr-canvas" width="200" height="200"></canvas></div><div id="qr-message" class="sub"></div><div class="qr-actions"><button onclick="makeQR()">↻ Regenerate QR</button><button class="secondary" onclick="downloadQR()">Download QR</button><button class="secondary" onclick="copyLink()">Copy link</button><a class="secondary" id="open-link" target="_blank" rel="noopener">Open passport</a></div><div class="host-config"><label for="host-override-input">Phone / LAN / public host:</label><input id="host-override-input" placeholder="http://192.168.1.x:8000"><button class="action" onclick="applyHost()">Apply host</button><span>Use your computer's LAN IP or a public HTTPS URL when scanning from another device.</span></div></section>
<div class="footer">Wild Tea Tree Platform · Public tree passport · Generated from available linked records</div>`;
$('host-override-input').value=localStorage.getItem('tea_custom_qr_host')||window.location.origin;
$('open-link').href=`${getBaseUrl()}/tree_passport.html?id=${encodeURIComponent(t.tree_id)}`;makeQR();}
async function init(){const id=new URLSearchParams(location.search).get('id');if(!id){$('passport-content').innerHTML='<div class="error">No tree ID was supplied. Open the passport from a tree QR code or registry.</div>';return;}try{const data=await fetch(`/api/passport/${encodeURIComponent(id)}`).then(async r=>{if(!r.ok){const e=await r.json().catch(()=>({detail:r.statusText}));throw new Error(e.detail||`HTTP ${r.status}`);}return r.json();});passportData=data;const tree=data.tree;const [soil,climate,satellite,medicinal,postdeath]=await Promise.all([fetchOptional(`/api/soil/tree/${encodeURIComponent(id)}`),fetchOptional(`/api/climate/tree/${encodeURIComponent(id)}`),fetchOptional(`/api/satellite/vegetation/${encodeURIComponent(id)}?days=30`),fetchOptional(`/api/lifecycle/medicinal/${encodeURIComponent(id)}`),fetchOptional(`/api/lifecycle/post-death/${encodeURIComponent(id)}`)]);renderPassport(data,{soil,climate,satellite,medicinal,postdeath});}catch(e){console.error(e);$('passport-content').innerHTML=`<div class="error"><h2>Could not load this tree passport</h2><p>${esc(e.message)}</p><p>Confirm that the tree ID exists and the FastAPI server is running.</p></div>`;}}
init();
</script>
